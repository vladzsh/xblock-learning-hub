<!-- ========================================================================
     HTML-шаблон представлення Studio (studio_view) VladX Learning Hub

     ВАЖЛИВО ДЛЯ XBLOCK-РОЗРОБНИКА:
     Studio -- застосунок Open edX для створення та редагування курсів.
     Викладач бачить цей інтерфейс, коли натискає "Редагувати" (Edit)
     на компоненті в Studio.

     Представлення studio_view повинно:
     1. Показати форму редагування полів блоку
     2. При натисканні "Зберегти" -- надіслати дані на сервер через AJAX
     3. Викликати runtime.notify('save', {{state: 'end'}}) -- щоб Studio закрив вікно
     4. При натисканні "Скасувати" -- викликати runtime.notify('cancel', {{}})

     Плейсхолдери {{self.field_name}} замінюються значеннями полів через .format(self=self)
     ======================================================================== -->

<div class="vladx-studio-editor">

    <h2>Налаштування VladX Learning Hub</h2>

    <!-- ===== ПОЛЯ Scope.settings ===== -->
    <!-- Ці поля налаштовуються для конкретного використання блоку в курсі -->

    <div class="vladx-studio-field">
        <label for="vladx-display-name">
            Назва компонента
            <span class="vladx-studio-scope-hint">(display_name, Scope.settings)</span>
        </label>
        <input type="text" id="vladx-display-name" value="{self.display_name}" />
    </div>

    <!-- ===== ПОЛЯ Scope.content ===== -->
    <!-- Ці поля визначають вміст блоку, спільний для всіх запусків курсу -->

    <div class="vladx-studio-field">
        <label for="vladx-question">
            Текст питання
            <span class="vladx-studio-scope-hint">(question_text, Scope.content)</span>
        </label>
        <textarea id="vladx-question">{self.question_text}</textarea>
    </div>

    <div class="vladx-studio-field">
        <label for="vladx-correct-answer">
            Правильна відповідь
            <span class="vladx-studio-scope-hint">(correct_answer, Scope.content)</span>
        </label>
        <input type="text" id="vladx-correct-answer" value="{self.correct_answer}" />
    </div>

    <div class="vladx-studio-field">
        <label for="vladx-explanation">
            Пояснення до відповіді
            <span class="vladx-studio-scope-hint">(explanation, Scope.content)</span>
        </label>
        <textarea id="vladx-explanation">{self.explanation}</textarea>
    </div>

    <!-- ===== ЧИСЛОВІ ПОЛЯ Scope.settings ===== -->

    <div class="vladx-studio-field">
        <label for="vladx-max-attempts">
            Максимум спроб
            <span class="vladx-studio-scope-hint">(max_attempts, Integer, Scope.settings)</span>
        </label>
        <input type="number" id="vladx-max-attempts" value="{self.max_attempts}" min="1" />
    </div>

    <div class="vladx-studio-field">
        <label for="vladx-weight">
            Вага завдання
            <span class="vladx-studio-scope-hint">(weight, Float, Scope.settings)</span>
        </label>
        <input type="number" id="vladx-weight" value="{self.weight}" min="0.1" step="0.1" />
    </div>

    <!-- ===== БУЛЕВЕ ПОЛЕ Scope.settings ===== -->

    <div class="vladx-studio-field">
        <label>
            <!-- data-value використовується для коректної ініціалізації checkbox у JS -->
            <input type="checkbox" id="vladx-allow-reset" data-value="{self.allow_reset}" />
            Дозволити скидання відповіді
            <span class="vladx-studio-scope-hint">(allow_reset, Boolean, Scope.settings)</span>
        </label>
    </div>

    <!-- ===== КНОПКИ ЗБЕРЕЖЕННЯ / СКАСУВАННЯ ===== -->
    <!-- При збереженні JS викликає обробник save_settings, потім runtime.notify('save') -->
    <!-- При скасуванні JS викликає runtime.notify('cancel') -->
    <div class="vladx-studio-buttons">
        <button class="vladx-studio-save">Зберегти</button>
        <button class="vladx-studio-cancel">Скасувати</button>
    </div>

</div>
