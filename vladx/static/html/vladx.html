<!-- ========================================================================
     HTML-шаблон студентського представлення (student_view) VladX Learning Hub

     ВАЖЛИВО ДЛЯ XBLOCK-РОЗРОБНИКА:
     Цей файл завантажується в Python через resource_string("static/html/vladx.html")
     і підставляється у Fragment: frag = Fragment(html.format(self=self))

     Плейсхолдери {{self.field_name}} замінюються значеннями полів XBlock
     через Python str.format(). Подвійні фігурні дужки {{{{ }}}} екрануються
     в одинарні {{ }} після format(), що потрібно для CSS/JS всередині HTML.

     HTML-вміст додається до Fragment, який потім обгортається
     runtime-ом у <div> з атрибутами data-usage, data-init тощо.
     Саме через ці атрибути JavaScript-runtime знаходить та ініціалізує блок.
     ======================================================================== -->

<!-- Основний контейнер блоку -->
<!-- data-mode зберігає поточний режим відображення (compact/full) з Scope.preferences -->
<div class="vladx-block" data-mode="{self.display_mode}">

    <!-- ===== ЗАГОЛОВОК БЛОКУ ===== -->
    <!-- display_name -- поле Scope.settings, встановлюється викладачем у Studio -->
    <div class="vladx-header">
        <h3 class="vladx-display-name">{self.display_name}</h3>
        <!-- Кнопка перемикання режиму: compact приховує другорядні секції -->
        <button class="vladx-toggle-mode"
                title="Перемкнути режим відображення (Scope.preferences)">
            {self.display_mode}
        </button>
    </div>

    <!-- ===== СЕКЦІЯ ПИТАННЯ ===== -->
    <!-- question_text -- поле Scope.content, спільне для всіх студентів і всіх запусків курсу -->
    <div class="vladx-question">
        <p class="vladx-question-text">{self.question_text}</p>
    </div>

    <!-- ===== СЕКЦІЯ ВВЕДЕННЯ ВІДПОВІДІ ===== -->
    <!-- student_answer -- поле Scope.user_state, унікальне для кожного студента -->
    <div class="vladx-answer-section">
        <input type="text"
               class="vladx-answer-input"
               value="{self.student_answer}"
               placeholder="Введіть вашу відповідь..." />

        <div class="vladx-buttons">
            <!-- Кнопка викликає обробник submit_answer через AJAX -->
            <button class="vladx-submit-btn">Надіслати</button>
            <!-- Кнопка викликає обробник reset_answer через AJAX -->
            <button class="vladx-reset-btn">Скинути</button>
        </div>
    </div>

    <!-- ===== СЕКЦІЯ РЕЗУЛЬТАТУ ===== -->
    <!-- Прихована за замовчуванням (display: none в CSS). JavaScript показує після надсилання -->
    <div class="vladx-result">
        <div class="vladx-result-message"></div>
        <div class="vladx-explanation"></div>
    </div>

    <!-- ===== ПІДКАЗКИ ===== -->
    <!-- hints -- поле типу List у Scope.settings -->
    <div class="vladx-hints">
        <button class="vladx-hint-btn">Показати підказку</button>
        <div class="vladx-hint-text"></div>
    </div>

    <!-- ===== СТАТИСТИКА СПРОБ ТА БАЛІВ ===== -->
    <!-- attempts_used (Scope.user_state) / max_attempts (Scope.settings) -->
    <!-- score_earned (Scope.user_state) / weight (Scope.settings) -->
    <div class="vladx-attempts-info">
        <span>Спроб:
            <strong class="vladx-attempts-used">{self.attempts_used}</strong>
            з
            <strong class="vladx-max-attempts">{self.max_attempts}</strong>
        </span>
        <span class="vladx-score">Бал:
            <strong class="vladx-score-value">{self.score_earned}</strong>
            / {self.weight}
        </span>
    </div>

    <!-- ===== СЕКЦІЯ ГОЛОСУВАННЯ ===== -->
    <!-- upvotes, downvotes -- Scope.user_state_summary (агреговані дані всіх студентів) -->
    <!-- voted -- Scope.user_state (прапорець конкретного студента) -->
    <div class="vladx-voting">
        <span class="vladx-voting-label">Оцініть питання:</span>
        <button class="vladx-upvote"
                title="Голосувати ЗА (Scope.user_state_summary)">
            &#x1F44D; <span class="vladx-upvote-count">{self.upvotes}</span>
        </button>
        <button class="vladx-downvote"
                title="Голосувати ПРОТИ (Scope.user_state_summary)">
            &#x1F44E; <span class="vladx-downvote-count">{self.downvotes}</span>
        </button>
        <!-- total_submissions -- Scope.user_state_summary -->
        <span class="vladx-total-submissions">
            Усього відповідей: <span class="vladx-total-sub-count">{self.total_submissions}</span>
        </span>
    </div>

    <!-- ===== СЕКЦІЯ ДОЧІРНІХ БЛОКІВ ===== -->
    <!-- Якщо has_children = True, сюди Python-код вставить відрендерені дочірні блоки -->
    <!-- Дочірні блоки рендеряться через self.runtime.render_child() -->
    <div class="vladx-children">
        <!-- Вміст дочірніх блоків додається програмно в student_view -->
    </div>
</div>
